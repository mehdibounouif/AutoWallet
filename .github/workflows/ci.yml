name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python 3.14 (same version as the Docker image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          cp .env.example .env
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: bank-simulator/requirements*.txt

      - name: Install dependencies
        working-directory: bank-simulator
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run simulator tests
        working-directory: bank-simulator
        run: pytest -q

  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node 22 (same version as the Docker image)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: authorization/package-lock.json

      - name: Install dependencies
        working-directory: authorization
        run: npm ci

      - name: Run authorization service tests (pins)
        working-directory: authorization
        run: npm run test --if-present

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build backend/

      - name: Build bank simulator image
        run: docker build bank-simulator/

      - name: Build authorization image
        run: docker build authorization/
