services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bank-simulator:
    restart: unless-stopped
    build: bank-simulator/
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8001), 2)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    restart: unless-stopped
    build: backend/
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      BANK_SIMULATOR_URL: http://bank-simulator:8001
      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
     
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_GOOGLE_CALLBACK_URL: ${FRONTEND_GOOGLE_CALLBACK_URL} ## not setted
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      FRONTEND_EMAIL_VERIFY_URL: https://localhost/auth/verify-email
      # FRONTEND_PASSWORD_RESET_URL: https://localhost/auth/reset-password

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s


  api-gateway:
    restart: unless-stopped
    build: api-gateway/
    environment:
      JWT_SECRET: ${SECRET_KEY}
      NODE_ENV: 'test1'
      PORT: "3000"
      FRONTEND_ORIGIN: "https://localhost"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    restart: unless-stopped
    build: frontend/
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    restart: unless-stopped
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-caddy-data:/data
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.31
    ports:
      - "8025:8025"
   
volumes:
  pgdata:
  proxy-caddy-data:
